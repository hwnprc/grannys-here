<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk through this place</title>
<style>
  :root{--bg:#140f0b;--ink:#f6ece1;--dim:#c6b4a3;--faint:#8d7a69;--amber:#f0a850;
        --line:rgba(246,236,225,.14);
        --serif:Georgia,"Iowan Old Style",Palatino,serif;
        --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
        color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas{display:block;width:100%;height:100%}

  #hud{position:fixed;left:0;right:0;bottom:0;z-index:3;pointer-events:none;
       padding:1.2rem max(16px,env(safe-area-inset-left,0px)) calc(1.2rem + env(safe-area-inset-bottom,0px));
       background:linear-gradient(to top,rgba(20,15,11,.9),transparent)}
  #hud .inner{max-width:52rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:baseline}
  #title{font-family:var(--serif);font-size:1.25rem;margin:0}
  #help{font-size:.86rem;color:var(--faint);margin:0}
  a.back{pointer-events:auto;margin-left:auto;font-size:.9rem;color:var(--amber);
    text-decoration:none;border:1px solid rgba(240,168,80,.45);border-radius:999px;padding:.5rem 1.1rem}
  a.back:hover{background:rgba(240,168,80,.14)}

  #load{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:var(--bg);
        transition:opacity .8s ease}
  #load.gone{opacity:0;pointer-events:none}
  #load .box{text-align:center;padding:0 1.5rem;max-width:30rem}
  #load p{font-family:var(--serif);font-size:1.2rem;color:var(--dim);margin:0 0 1rem}
  #bar{width:min(22rem,70vw);height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 auto}
  #bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .25s ease}
  #pct{font-size:.84rem;color:var(--faint);margin-top:.7rem}
  .err{color:#f0a0a0;font-family:var(--sans);font-size:.95rem}
  .err a{color:var(--amber)}
</style>
</head>
<body>

<div id="load"><div class="box">
  <p id="loadmsg">Opening the place…</p>
  <div id="bar"><i></i></div>
  <p id="pct"></p>
</div></div>

<div id="hud"><div class="inner">
  <p id="title"></p>
  <p id="help">Drag to look · scroll to move closer · two fingers to pan</p>
  <a class="back" id="back" href="#">← Back to the memory</a>
</div></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
}}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const params = new URLSearchParams(location.search);
const id = params.get("id") || "sunday-park";
const loadEl = document.getElementById("load");
const msg = document.getElementById("loadmsg");
const bar = document.querySelector("#bar i");
const pct = document.getElementById("pct");

if(!/^[A-Za-z0-9_-]+$/.test(id)){
  msg.innerHTML = '<span class="err">That memory id is not valid.</span>';
  throw new Error("bad id");
}
document.getElementById("back").href = "viewer.html?id=" + encodeURIComponent(id);

// Name the place from the memory, so the HUD is not a bare file name.
fetch("../memories/" + id + "/memory.json", {cache:"no-store"})
  .then(r => r.ok ? r.json() : null)
  .then(m => { if(m){ document.getElementById("title").textContent = m.place_name || m.title || ""; }})
  .catch(() => {});

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Spark draws the splats during the normal render(); without a SparkRenderer in
// the scene the data loads and nothing appears.
const spark = new SparkRenderer({ renderer });
scene.add(spark);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.05, 1000);
camera.position.set(0, 0, 0.1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = -0.4;          // drag the world, not the camera
controls.target.set(0, 0, -1.2);

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Fetch with progress: a 7-8 MB splat is a long silent wait otherwise.
const url = "../memories/" + id + "/world.spz";
fetch(url)
  .then(async res => {
    if(!res.ok) throw new Error("no world.spz for this memory (HTTP " + res.status + ")");
    const total = Number(res.headers.get("content-length")) || 0;
    const reader = res.body.getReader();
    const chunks = []; let got = 0;
    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      chunks.push(value); got += value.length;
      if(total){
        const p = Math.round(got/total*100);
        bar.style.width = p + "%"; pct.textContent = p + "%";
      } else {
        pct.textContent = (got/1e6).toFixed(1) + " MB";
      }
    }
    const blob = new Blob(chunks);
    return URL.createObjectURL(blob);
  })
  .then(objectUrl => {
    msg.textContent = "Unpacking the place…";
    const splats = new SplatMesh({ url: objectUrl });
    splats.quaternion.set(1, 0, 0, 0);      // SPZ comes in y-down
    scene.add(splats);
    return splats.initialized?.then(() => splats) ?? splats;
  })
  .then(() => { loadEl.classList.add("gone"); })
  .catch(err => {
    bar.parentElement.hidden = true; pct.textContent = "";
    msg.innerHTML = '<span class="err">Could not open this place.<br>' + err.message +
      '<br><br><a href="viewer.html?id=' + encodeURIComponent(id) + '">Back to the memory</a></span>';
  });

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
