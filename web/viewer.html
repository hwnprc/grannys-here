<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granny's Here</title>
<style>
  :root{
    --paper:#f6f4ed; --surface:#fffefa; --ink:#292f28; --muted:#707569; --line:#dddcd1;
    --green:#3b5747; --clay:#a24f35; --light:#e9eee7;
    --serif:Georgia,"Times New Roman",serif; --sans:Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  .top{max-width:1100px;margin:auto;padding:26px 42px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px}
  .top a{color:var(--ink);text-decoration:none}.top a:hover{text-decoration:underline}
  .brand{font:20px var(--serif)}.brand span{color:var(--clay)}
  main{max-width:1100px;margin:auto;padding:28px 42px 70px;display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:start}
  /* the place: a photograph in a frame, as his illustration card is */
  #world-layer{position:relative;background:var(--light);border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 22px 48px -28px #2a2e28}
  #pano,#world{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
  #pano.visible,#world.visible{opacity:1}
  #scrim{display:none}
  .story{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .place{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 14px;display:flex;align-items:center;gap:8px}
  .place::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--clay)}
  h1{font:300 42px/1.12 var(--serif);letter-spacing:-1.2px;margin:0 0 18px;text-wrap:balance}
  .summary{font:19px/1.55 var(--serif);margin:0 0 20px;color:var(--ink)}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding:0;list-style:none}
  .meta li{font-size:11px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 10px}
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  button,a.ghost{font:600 14px var(--sans);border-radius:7px;padding:12px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:10px;min-height:44px;border:1px solid transparent;transition:background .18s ease}
  button{background:var(--green);color:#fffefa}button:hover:not(:disabled){background:#2e4739}
  button:disabled{opacity:.45;cursor:default}
  a.ghost{background:transparent;color:var(--ink);border-color:var(--line)}a.ghost:hover{background:#eeede5}
  button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #b77c40;outline-offset:3px}
  .transcript{margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
  .transcript summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);list-style:none}
  .transcript summary::-webkit-details-marker{display:none}.transcript summary::before{content:"+  "}.transcript[open] summary::before{content:"−  "}
  .transcript p{font:16px/1.7 var(--serif);color:var(--ink);background:#f3f2eb;border-left:2px solid #adbda5;padding:16px;margin:12px 0 0;max-height:34vh;overflow:auto}
  .note{margin-top:18px;font-size:12px;color:var(--muted)}
  .state{font:20px/1.5 var(--serif);color:var(--muted);max-width:34rem;grid-column:1/-1}
  .state code{font:12px ui-monospace,Menlo,monospace;color:var(--clay);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
  [hidden]{display:none!important}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#pano,#world{opacity:1}}
  @media(max-width:820px){main{grid-template-columns:1fr;padding:22px 20px 50px}.top{padding:20px 20px 0}h1{font-size:34px}}
</style>
</head>
<body>
<div class="top"><a class="brand" href="/">Before I Forget <span>·</span> Granny's Here</a><a href="family.html">Family page →</a></div>

<main>
<div id="scrim"></div>
  <!-- loading / error -->
  <p class="state" id="state">Opening the memory…</p>

  <!-- the memory -->
  <article class="story" id="story" hidden>
    <p class="place" id="place"></p>
    <h1 id="title"></h1>
    <p class="summary" id="summary"></p>
    <ul class="meta" id="meta"></ul>

    <div class="actions">
      <button id="replay" type="button">Hear the story again</button>
      <a id="world-link" class="ghost" href="#" target="_blank" rel="noopener" hidden>
        Walk through this place &#8599;
      </a>
    </div>

    <details class="transcript" id="transcript-box" hidden>
      <summary>In her words</summary>
      <p id="transcript"></p>
    </details>

    <p class="note" id="note" hidden></p>
  </article>
<div id="world-layer">
  <img id="pano" alt="" aria-hidden="true">
  <video id="world" muted loop playsinline preload="auto" aria-hidden="true"></video>
</div>
</main>

<audio id="voice" preload="auto"></audio>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  var state = $("state");
  var story = $("story");
  var voice = $("voice");
  var world = $("world");
  var replay = $("replay");

  var id = new URLSearchParams(location.search).get("id");

  function fail(html) {
    state.innerHTML = html;
    state.hidden = false;
    story.hidden = true;
  }

  if (!id) {
    fail("No memory chosen.<br><br>Open this page with a memory id, for example " +
         "<code>viewer.html?id=sunday-park</code>.");
    return;
  }

  // Keep the id to a safe slug: this builds a path.
  if (!/^[A-Za-z0-9_-]+$/.test(id)) {
    fail("That memory id isn't valid.<br><br>Ids may use letters, numbers, " +
         "hyphens and underscores only.");
    return;
  }

  var base = "../memories/" + id + "/";

  fetch(base + "memory.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) { throw new Error("HTTP " + res.status); }
      return res.json();
    })
    .then(render)
    .catch(function (err) {
      fail("Couldn't open <code>" + id + "</code>.<br><br>" +
           "Check that <code>memories/" + id + "/memory.json</code> exists and that " +
           "you're serving the repo root with <code>python3 -m http.server 8000</code>." +
           "<br><br><span style=\"font-size:0.8rem\">(" + err.message + ")</span>");
    });

  function render(m) {
    var files = m.files || {};

    document.title = (m.title || "A memory") + " — Granny's Here";

    // place line
    $("place").textContent = m.place_name || m.place_type || "A place she loved";

    $("title").textContent = m.title || "A memory";
    $("summary").textContent = m.summary || "";
    if (!m.summary) { $("summary").hidden = true; }

    // meta chips: people, when, season, feeling
    var chips = [];
    var people = Array.isArray(m.people) ? m.people.filter(Boolean) : [];
    if (people.length) { chips.push("With " + listify(people)); }
    if (m.time_period)  { chips.push(m.time_period); }
    if (m.season)       { chips.push(cap(m.season)); }
    if (m.emotion)      { chips.push(cap(m.emotion)); }

    var meta = $("meta");
    chips.forEach(function (text) {
      var li = document.createElement("li");
      li.textContent = text;
      meta.appendChild(li);
    });
    if (!chips.length) { meta.hidden = true; }

    // her own voice
    var audioFile = files.audio || "audio.wav";
    voice.src = base + audioFile;

    voice.addEventListener("ended", function () {
      replay.textContent = "Hear the story again";
    });

    voice.addEventListener("error", function () {
      replay.disabled = true;
      replay.textContent = "Recording not found";
      replay.style.opacity = "0.5";
      replay.style.cursor = "default";
    });

    replay.addEventListener("click", function () {
      if (voice.paused) {
        voice.play().then(function () {
          replay.textContent = "Pause";
        }).catch(function () {
          replay.textContent = "Couldn't play the recording";
        });
      } else {
        voice.pause();
        replay.textContent = "Hear the story again";
      }
    });

    // transcript, quietly available
    if (m.transcript) {
      $("transcript").textContent = m.transcript;
      $("transcript-box").hidden = false;
    }

    // ---- the 3D world ----
    // Marble sends X-Frame-Options: DENY, so its world page cannot be iframed.
    // Inline backdrop comes from the panorama (or a recorded video); the live,
    // navigable world opens in a new tab.
    // Prefer our own in-page world: Marble cannot be embedded (X-Frame-Options:
    // DENY), but we have the same splat, so we render it here instead of
    // sending her family off to another site.
    var link = $("world-link");
    if (files.splat) {
      link.href = "world.html?id=" + encodeURIComponent(id);
      link.removeAttribute("target");
      link.removeAttribute("rel");
      link.textContent = "Walk through this place";
      link.hidden = false;
    } else if (m.world_url) {
      link.href = m.world_url;
      link.hidden = false;
    }

    var panoFile  = files.pano;
    var worldFile = files.world;

    // Preference 2: a recorded video of the world.
    function tryVideo() {
      if (worldFile && /\.(mp4|webm|mov)$/i.test(worldFile)) {
        world.addEventListener("canplay", function () {
          world.classList.add("visible");
          var p = world.play();
          if (p && p.catch) { p.catch(function () { /* autoplay blocked; still shown */ }); }
        });
        world.addEventListener("error", function () { missingWorld(m); });
        world.src = base + worldFile;
      } else {
        missingWorld(m);
      }
    }

    // Preference 1: panorama still — offline-safe, no autoplay rules.
    if (panoFile) {
      var pano = $("pano");
      pano.addEventListener("load", function () { pano.classList.add("visible"); });
      pano.addEventListener("error", tryVideo);   // fall through to the video
      pano.src = base + panoFile;
    } else {
      tryVideo();
    }

    state.hidden = true;
    story.hidden = false;
  }

  function missingWorld(m) {
    showNote(m && m.world_url
      ? "No panorama saved for this place yet — the live 3D world still opens above."
      : "The 3D world for this place hasn't been generated yet.");
  }

  function showNote(text) {
    var note = $("note");
    note.textContent = text;
    note.hidden = false;
  }

  function cap(s) {
    return String(s).charAt(0).toUpperCase() + String(s).slice(1);
  }

  function listify(arr) {
    if (arr.length === 1) { return arr[0]; }
    if (arr.length === 2) { return arr[0] + " and " + arr[1]; }
    return arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
  }
})();
</script>
</body>
</html>
